name: Sync upstream with housekeeping

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-with-housekeeping
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'JosiahSiegel/manifest'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_UPSTREAM_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote get-url upstream >/dev/null 2>&1 || \
            git remote add upstream https://github.com/mnfst/manifest.git

      - name: Fetch remotes
        run: |
          git fetch origin main
          git fetch upstream main

      - name: Save self before reset
        run: cp .github/workflows/housekeeping-overlay.yml /tmp/housekeeping-overlay.yml

      - name: Reset main to upstream
        run: git switch -C main upstream/main

      - name: Apply fork housekeeping overlay
        run: |
          mkdir -p .github/workflows
          cp /tmp/housekeeping-overlay.yml .github/workflows/housekeeping-overlay.yml

          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          Path('.github/workflows/docker-image.yml').write_text(dedent('''\
          name: Docker image

          on:
            push:
              branches:
                - main
              tags:
                - 'v*.*.*'
            pull_request:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read
            packages: write

          concurrency:
            group: docker-image-${{ github.ref }}
            cancel-in-progress: true

          env:
            IMAGE_NAME: ghcr.io/josiahsiegel/manifest

          jobs:
            build:
              name: Build image
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v5

                - name: Set up Docker Buildx
                  uses: docker/setup-buildx-action@v3

                - name: Log in to GHCR
                  if: github.event_name != 'pull_request'
                  uses: docker/login-action@v3
                  with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ github.token }}

                - name: Generate metadata
                  id: meta
                  uses: docker/metadata-action@v5
                  with:
                    images: ${{ env.IMAGE_NAME }}
                    tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=branch
                      type=ref,event=tag
                      type=sha,prefix=sha-

                - name: Build and publish image
                  uses: docker/build-push-action@v6
                  with:
                    context: .
                    file: docker/Dockerfile
                    push: ${{ github.event_name != 'pull_request' }}
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    cache-from: type=gha
                    cache-to: type=gha,mode=max
          '''))

          path = Path('packages/backend/src/routing/proxy/proxy-rate-limiter.ts')
          text = path.read_text()
          old = """const MAX_RATE_ENTRIES = 50_000;\nconst CONCURRENCY_MAX = 10;\nconst CLEANUP_INTERVAL_MS = 60_000;\n"""
          new = """const MAX_RATE_ENTRIES = 50_000;\nconst DEFAULT_CONCURRENCY_MAX = 10;\nconst CONCURRENCY_MAX = positiveIntegerEnv('CONCURRENCY_MAX', DEFAULT_CONCURRENCY_MAX);\nconst CLEANUP_INTERVAL_MS = 60_000;\n\nfunction positiveIntegerEnv(name: string, fallback: number): number {\n  const raw = process.env[name];\n  if (!raw) {\n    return fallback;\n  }\n\n  const value = Number(raw);\n  return Number.isInteger(value) && value > 0 ? value : fallback;\n}\n"""
          if old not in text and new not in text:
              raise SystemExit('proxy-rate-limiter.ts did not match expected upstream snippet')
          if old in text:
              path.write_text(text.replace(old, new))

          path = Path('packages/backend/src/routing/proxy/__tests__/proxy-rate-limiter.spec.ts')
          text = path.read_text()
          marker = """    it('throws with correct status and message on concurrency exceeded', () => {\n"""
          insert = """    it('supports CONCURRENCY_MAX overrides', async () => {\n      const originalConcurrencyMax = process.env['CONCURRENCY_MAX'];\n      process.env['CONCURRENCY_MAX'] = '12';\n      jest.resetModules();\n      const { ProxyRateLimiter: ConfiguredProxyRateLimiter } =\n        await import('../proxy-rate-limiter');\n      const configuredLimiter = new ConfiguredProxyRateLimiter();\n\n      try {\n        for (let i = 0; i < 12; i++) {\n          expect(() => configuredLimiter.acquireSlot('user-1')).not.toThrow();\n        }\n\n        try {\n          configuredLimiter.acquireSlot('user-1');\n          fail('Expected HttpException');\n        } catch (err) {\n          expect((err as HttpException).getStatus()).toBe(HttpStatus.TOO_MANY_REQUESTS);\n          expect((err as HttpException).message).toContain('[🦚 Manifest M203]');\n        }\n      } finally {\n        configuredLimiter.onModuleDestroy();\n        if (originalConcurrencyMax === undefined) {\n          delete process.env['CONCURRENCY_MAX'];\n        } else {\n          process.env['CONCURRENCY_MAX'] = originalConcurrencyMax;\n        }\n        jest.resetModules();\n      }\n    });\n\n"""
          if marker not in text:
              raise SystemExit('proxy-rate-limiter.spec.ts did not match expected upstream snippet')
          if 'supports CONCURRENCY_MAX overrides' not in text:
              text = text.replace(marker, insert + marker)
              path.write_text(text)
          PY

      - name: Commit housekeeping overlay
        run: |
          git add .github/workflows/housekeeping-overlay.yml \
            .github/workflows/docker-image.yml \
            packages/backend/src/routing/proxy/proxy-rate-limiter.ts \
            packages/backend/src/routing/proxy/__tests__/proxy-rate-limiter.spec.ts

          if git diff --cached --quiet; then
            echo "No housekeeping overlay changes to commit."
          else
            git commit -m "chore: apply fork housekeeping overlay"
          fi

      - name: Force-push clean main with overlay
        run: git push --force-with-lease origin main
